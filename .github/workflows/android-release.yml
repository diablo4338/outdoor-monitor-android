name: Android release

on:
  push:
    branches: [master]
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Explicit version name, for example 1.1.0
        required: false
        type: string
      version_code:
        description: Optional Android versionCode override
        required: false
        type: number

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: [self-hosted, linux, x64]
    environment: dev
    env:
      RELEASE_API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
      RELEASES_DIR: ${{ vars.RELEASES_DIR }}
      SIGNING_DIR: ${{ vars.SIGNING_DIR }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        shell: bash
        run: |
          : "${RELEASE_API_BASE_URL:?Set the RELEASE_API_BASE_URL repository variable}"
          : "${RELEASES_DIR:?Set the RELEASES_DIR repository variable}"
          : "${SIGNING_DIR:?Set the SIGNING_DIR repository variable}"
          : "${GOOGLE_WEB_CLIENT_ID:?Set the GOOGLE_WEB_CLIENT_ID secret in the dev environment}"
          if [[ -n "${{ inputs.version_code }}" ]]; then
            version_code="${{ inputs.version_code }}"
          else
            version_code=$((1000 + GITHUB_RUN_NUMBER))
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#app-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build signed APK in Docker
        shell: bash
        run: |
          set -a
          source "$SIGNING_DIR/release.env"
          set +a
          docker buildx build \
            --file docker/Dockerfile.apk \
            --target artifact \
            --output type=local,dest=build/apk \
            --build-arg VERSION_NAME="$VERSION_NAME" \
            --build-arg VERSION_CODE="$VERSION_CODE" \
            --build-arg RELEASE_API_BASE_URL="$RELEASE_API_BASE_URL" \
            --build-arg GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --build-arg POLL_INTERVAL_SECONDS=10 \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --build-arg PUBLISHED_AT="$PUBLISHED_AT" \
            --secret id=release_keystore,src="$SIGNING_DIR/release.jks" \
            --secret id=signing_store_password,env=SIGNING_STORE_PASSWORD \
            --secret id=signing_key_password,env=SIGNING_KEY_PASSWORD \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: outdoor-monitor-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: build/apk/releases
          if-no-files-found: error

      - name: Publish release atomically
        shell: bash
        run: |
          staging="$RELEASES_DIR/.incoming-$VERSION_CODE"
          if [[ -f "$RELEASES_DIR/latest.json" ]]; then
            current_version_code="$(awk -F: '/"version_code"/ {gsub(/[^0-9]/, "", $2); print $2}' "$RELEASES_DIR/latest.json")"
            test "$VERSION_CODE" -gt "$current_version_code"
          fi
          test ! -e "$RELEASES_DIR/$VERSION_CODE"
          install -d -m 755 "$staging" "$RELEASES_DIR"
          cp -a "build/apk/releases/$VERSION_CODE" "$staging/"
          cp "build/apk/releases/latest.json" "$staging/latest.json"
          chmod 755 "$staging/$VERSION_CODE"
          chmod 644 "$staging/$VERSION_CODE"/* "$staging/latest.json"
          mv "$staging/$VERSION_CODE" "$RELEASES_DIR/$VERSION_CODE"
          mv "$staging/latest.json" "$RELEASES_DIR/latest.json"
          rmdir "$staging"
